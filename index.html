<!DOCTYPE html> <html lang="th"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>เครื่องคำนวณสูตรวิน</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; font-family: Arial, Tahoma, sans-serif; background: linear-gradient(135deg, #eaf7ff, #f8edff, #fff0f7); color: #29253d; } .app { width: 100%; max-width: 375px; margin: auto; padding: 15px 12px 22px; } .header { text-align: center; margin-bottom: 15px; } .header h1 { margin: 0; font-size: 22px; font-weight: 900; color: #5943a0; } .header p { margin: 6px 0 0; font-size: 12px; font-weight: 700; color: #716b7f; } .card { background: rgba(255,255,255,0.97); border-radius: 18px; padding: 15px; box-shadow: 0 7px 22px rgba(90,60,140,0.12); } .field { margin-bottom: 12px; } .field:last-child { margin-bottom: 0; } label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 900; color: #403951; } input { width: 100%; height: 45px; border: 1.5px solid #ddd4ef; border-radius: 11px; background: #fff; text-align: center; font-size: 20px; font-weight: 900; color: #30284b; outline: none; } input:focus { border-color: #826cd0; box-shadow: 0 0 0 3px rgba(130,108,208,0.12); } input::placeholder { color: transparent; } .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 12px; } button { height: 42px; border: 0; border-radius: 12px; font-size: 14px; font-weight: 900; cursor: pointer; } .calculate { color: white; background: linear-gradient(135deg, #628cff, #8165d7); } .clear { color: #744d6d; background: linear-gradient(135deg, #ffdce9, #eadcff); } .results { display: none; margin-top: 15px; } .results.show { display: block; } .result-card { display: flex; justify-content: space-between; align-items: center; min-height: 51px; padding: 10px 14px; margin-bottom: 8px; background: white; border: 1.5px solid #e4dcf1; border-radius: 14px; box-shadow: 0 4px 13px rgba(90,60,140,0.07); } .result-name { font-size: 14px; font-weight: 900; color: #514968; } .result-value { font-size: 18px; font-weight: 900; color: #523c91; } .converter { margin-left: 7px; font-size: 17px; font-weight: 900; color: #684783; } .win-card { margin-top: 12px; padding: 15px; border-radius: 17px; text-align: center; background: linear-gradient(135deg, #eeeaff, #ffeaf5); border: 1.5px solid #d1c3ed; } .win-title { font-size: 15px; font-weight: 900; color: #684783; margin-bottom: 6px; } .win-value { min-height: 33px; font-size: 25px; font-weight: 900; letter-spacing: 1.5px; color: #51318a; word-break: break-word; } .error { display: none; margin-top: 9px; text-align: center; font-size: 12px; font-weight: 900; color: #d04d72; } .error.show { display: block; } @media (max-width: 380px) { .app { max-width: 100%; padding: 15px 12px 22px; } .header h1 { font-size: 20px; } .win-value { font-size: 23px; } } @media (max-width: 260px) { .buttons { grid-template-columns: 1fr; } .win-value { font-size: 21px; } } </style> </head> <body> <div class="app"> <div class="header"> <h1>เครื่องคำนวณสูตรวิน</h1> <p>กรอกข้อมูลแล้วกดคำนวณ</p> </div> <div class="card"> <div class="field"> <label for="top">3 ตัวบน</label> <input id="top" type="text" inputmode="numeric" maxlength="3" autocomplete="off"> </div> <div class="field"> <label for="bottom">2 ตัวล่าง</label> <input id="bottom" type="text" inputmode="numeric" maxlength="2" autocomplete="off"> </div> </div> <div class="buttons"> <button type="button" class="calculate" onclick="calculateFormula()"> คำนวณ </button> <button type="button" class="clear" onclick="clearAll()"> ล้างข้อมูล </button> </div> <div class="results" id="results"> <div class="result-card"> <div class="result-name">สูตร 1</div> <div class="result-value" id="formula1"></div> </div> <div class="result-card"> <div class="result-name">สูตร 2</div> <div class="result-value" id="formula2"></div> </div> <div class="win-card"> <div class="win-title">สูตรวิน</div> <div class="win-value" id="win"> </div> </div> </div> <div class="error" id="error"></div> </div> <script> /* ================================================== รับเฉพาะตัวเลข ================================================== */ document.getElementById("top").addEventListener( "input", function () { this.value = this.value .replace(/[^0-9]/g, "") .substring(0, 3); } ); document.getElementById("bottom").addEventListener( "input", function () { this.value = this.value .replace(/[^0-9]/g, "") .substring(0, 2); } ); /* ================================================== ตัดทศนิยม 2 ตำแหน่ง โดยไม่ปัดเศษ ================================================== */ function formatNumber(number) { const truncated = Math.trunc(number * 100) / 100; return truncated.toFixed(2); } /* ================================================== ระบบแปลงเลขสำหรับสูตร 1 เท่านั้น มี 6 อย่างเดียว → แปลงเป็น 9 มี 9 อย่างเดียว → แปลงเป็น 6 มีทั้ง 6 และ 9 → ไม่แปลง ไม่มี 6/9 → ไม่แปลง ================================================== */ function getConverter(text) { const has6 = text.includes("6"); const has9 = text.includes("9"); /* มีทั้ง 6 และ 9 → ไม่แปลง */ if (has6 && has9) { return ""; } /* มี 6 อย่างเดียว → 9 */ if (has6 && !has9) { return "(9)"; } /* มี 9 อย่างเดียว → 6 */ if (has9 && !has6) { return "(6)"; } return ""; } /* ================================================== ดึงเลขตัวแปลงสำหรับสูตรวิน ================================================== */ function getConverterDigits(text) { const has6 = text.includes("6"); const has9 = text.includes("9"); /* มีทั้ง 6 และ 9 → ไม่แปลง */ if (has6 && has9) { return ""; } /* มี 6 อย่างเดียว → ใช้ 9 */ if (has6 && !has9) { return "9"; } /* มี 9 อย่างเดียว → ใช้ 6 */ if (has9 && !has6) { return "6"; } return ""; } /* ================================================== สร้างสูตรวิน สูตร 1 + ตัวแปลงสูตร 1 + สูตร 2 สูตร 2 ไม่มีตัวแปลง ================================================== */ function createWin( formula1, converter1, formula2 ) { /* ดึงเฉพาะตัวเลขจากสูตร 1 */ const formula1Digits = formula1.replace(/[^0-9]/g, ""); /* ดึงเฉพาะตัวเลขจากสูตร 2 */ const formula2Digits = formula2.replace(/[^0-9]/g, ""); /* รวมตามลำดับ */ const combined = formula1Digits + converter1 + formula2Digits; /* ตัดเลขซ้ำ โดยรักษาลำดับ */ let uniqueDigits = ""; for (let i = 0; i < combined.length; i++) { const digit = combined[i]; if (!uniqueDigits.includes(digit)) { uniqueDigits += digit; } } return uniqueDigits; } /* ================================================== คำนวณสูตร ================================================== */ function calculateFormula() { const topText = document.getElementById("top").value.trim(); const bottomText = document.getElementById("bottom").value.trim(); const results = document.getElementById("results"); const formula1Element = document.getElementById("formula1"); const formula2Element = document.getElementById("formula2"); const winElement = document.getElementById("win"); const errorElement = document.getElementById("error"); /* ล้างข้อความผิดพลาด */ errorElement.textContent = ""; errorElement.classList.remove("show"); results.classList.remove("show"); /* ================================================== ตรวจสอบ 3 ตัวบน ================================================== */ if (topText === "") { errorElement.textContent = "กรุณากรอกเลข 3 ตัวบน"; errorElement.classList.add("show"); document.getElementById("top").focus(); return; } if (topText.length !== 3) { errorElement.textContent = "กรุณากรอกเลข 3 ตัวบนให้ครบ 3 หลัก"; errorElement.classList.add("show"); document.getElementById("top").focus(); return; } /* ================================================== ตรวจสอบ 2 ตัวล่าง ================================================== */ if (bottomText === "") { errorElement.textContent = "กรุณากรอกเลข 2 ตัวล่าง"; errorElement.classList.add("show"); document.getElementById("bottom").focus(); return; } if (bottomText.length !== 2) { errorElement.textContent = "กรุณากรอกเลข 2 ตัวล่างให้ครบ 2 หลัก"; errorElement.classList.add("show"); document.getElementById("bottom").focus(); return; } /* ================================================== ตัวเลข 3 ตัวบน ================================================== */ const numberTop = Number(topText); /* ================================================== สูตร 1 3 ตัวบน × 0.07 ================================================== */ const result1 = numberTop * 0.07; /* ================================================== สูตร 2 3 ตัวบน × 0.52 ================================================== */ const result2 = numberTop * 0.52; /* ================================================== แสดงทศนิยม 2 ตำแหน่ง โดยไม่ปัดเศษ ================================================== */ const formatted1 = formatNumber(result1); const formatted2 = formatNumber(result2); /* ================================================== ตัวแปลงของสูตร 1 เท่านั้น ================================================== */ const converter1 = getConverter(formatted1); const converterDigits1 = getConverterDigits(formatted1); /* ================================================== แสดงผลสูตร 1 ================================================== */ formula1Element.innerHTML = formatted1 + ( converter1 ? '<span class="converter">' + converter1 + '</span>' : "" ); /* ================================================== แสดงผลสูตร 2 ไม่มีการแปลงเลข ================================================== */ formula2Element.textContent = formatted2; /* ================================================== สูตรวิน ================================================== */ const winResult = createWin( formatted1, converterDigits1, formatted2 ); winElement.textContent = winResult; /* แสดงผล */ results.classList.add("show"); } /* ================================================== ล้างข้อมูล ================================================== */ function clearAll() { document.getElementById("top").value = ""; document.getElementById("bottom").value = ""; document.getElementById("formula1") .textContent = ""; document.getElementById("formula2") .textContent = ""; document.getElementById("win") .textContent = ""; document.getElementById("results") .classList.remove("show"); document.getElementById("error") .textContent = ""; document.getElementById("error") .classList.remove("show"); document.getElementById("top").focus(); } /* ================================================== กด Enter เพื่อคำนวณ ================================================== */ document.getElementById("top").addEventListener( "keydown", function(event) { if (event.key === "Enter") { calculateFormula(); } } ); document.getElementById("bottom").addEventListener( "keydown", function(event) { if (event.key === "Enter") { calculateFormula(); } } ); </script> </body> </html>
